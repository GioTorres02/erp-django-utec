{% extends "base.html" %}

{% block content %}
<h2>{% if object %}Editar producto{% else %}Nuevo producto{% endif %}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'productos:lista' %}">Cancelar</a>
</form>
{% endblock %}
